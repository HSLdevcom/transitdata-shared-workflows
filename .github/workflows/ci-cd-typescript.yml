name: ci-cd-typescript.yml

permissions: {}

on:
  workflow_call:
    inputs:
      skipLint:
        description: Skip the MegaLinter job
        required: false
        type: boolean
        default: false
      checkAndTestOutsideDocker:
        required: false
        type: boolean
        default: false
      performRelease:
        required: false
        type: boolean
        default: false
      checkAndTestInsideDocker:
        required: false
        type: boolean
        default: true


env:
  IMAGE_NAME_MIXED_CASE: "${{ github.repository }}"
  TEST_STAGE: tester
  PRODUCTION_STAGE: production

jobs:
  lint:
    if: ${{ !inputs.skipLint }}
    name: Lint (MegaLinter)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use shared MegaLinter config if repo has none
        run: |
          set -euo pipefail
          [ -f .mega-linter.yml ] && exit 0
          REF=$(grep -roh \
            'transitdata-shared-workflows/.github/workflows/[^@]*@[^ "'\'']*' \
            "${GITHUB_WORKSPACE}/.github/workflows/" 2>/dev/null \
            | sed 's/.*@//' | head -1 || true)
          if [[ -z "${REF}" ]]; then
            echo "::warning::Could not detect shared workflow ref from caller workflows; falling back to main"
            REF="main"
          fi
          RAW="https://raw.githubusercontent.com/HSLdevcom/transitdata-shared-workflows/${REF}/megalinter"
          {
            echo "MEGALINTER_CONFIG=${RAW}/base.yml"
            echo "LINTER_RULES_PATH=${RAW}/linters"
          } >> "${GITHUB_ENV}"

      - name: Run MegaLinter
        uses: oxsecurity/megalinter/flavors/javascript@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc # v9.6.0
        env:
          VALIDATE_ALL_CODEBASE: ${{ github.event_name != 'pull_request' }}
          DISABLE_ERRORS: false
          GITHUB_COMMENT_REPORTER: false
          GITHUB_STATUS_REPORTER: false
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload MegaLinter reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: megalinter-reports
          path: |
            megalinter-reports
            mega-linter.log

  ci:
    name: Build, check, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          clean: 'true'
          fetch-depth: 2
          persist-credentials: false

      - name: Install Node
        # zizmor:ignore[cache-poisoning] Node binary tool-cache is implicit and cannot be disabled; no npm package cache is configured
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"

      - name: Install NPM dependencies
        run: npm ci

      - name: Check and test outside Docker
        if: ${{ inputs.checkAndTestOutsideDocker }}
        run: npm run check-and-build

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          report_type: test_results

      - name: Lowercase Docker Image Name
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME_MIXED_CASE,,}" >> "${GITHUB_ENV}"

      - name: Build and export to Docker
        if: ${{ inputs.checkAndTestInsideDocker }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          no-cache: true
          target: "${{ env.TEST_STAGE }}"
          tags: "${{ env.IMAGE_NAME }}:${{ env.TEST_STAGE }}"

      - name: Check and test
        if: ${{ inputs.checkAndTestInsideDocker }}
        run: |
          docker run --rm "${{ env.IMAGE_NAME }}:${{ env.TEST_STAGE }}"

  release:
    name: Build & push Docker image
    needs: [ci, lint]
    if: >-
      always() &&
      needs.ci.result == 'success' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/') ||
      inputs.performRelease == true)
    runs-on: ubuntu-latest
    environment: docker-hub-release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          clean: 'true'
          persist-credentials: false

      - name: Lowercase Docker Image Name
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME_MIXED_CASE,,}" >> "${GITHUB_ENV}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Extract docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,format=long

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_INFODEVOPS_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_INFODEVOPS_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          no-cache: true
          target: "${{ env.PRODUCTION_STAGE }}"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

name: ci.yml

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-scripts:
    name: Test Python scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pytest
        run: pip install pytest

      - name: Run script tests
        run: pytest scripts/ -v

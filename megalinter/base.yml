# A repo can extend it instead of replacing it:
#   EXTENDS:
#     - https://raw.githubusercontent.com/HSLdevcom/transitdata-shared-workflows/main/megalinter/base.yml
APPLY_FIXES: none
SHOW_ELAPSED_TIME: true
PRINT_ALPACA: false

# MegaLinter hides GITHUB_TOKEN from linters by default; zizmor needs it for online audits
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN
FLAVOR_SUGGESTIONS: false
FILTER_REGEX_EXCLUDE: '(^|/)(node_modules|dist|build|target|\.idea|package-lock\.json|yarn\.lock)(/|$)'

DISABLE_LINTERS:
  - COPYPASTE_JSCPD
  - SPELL_CSPELL
  - SPELL_LYCHEE
  - REPOSITORY_DEVSKIM
  - REPOSITORY_GRYPE
  - REPOSITORY_OSV_SCANNER
  - REPOSITORY_KINGFISHER
  - REPOSITORY_BETTERLEAKS
  - REPOSITORY_DUSTILOCK
  - REPOSITORY_SECRETLINT
  - REPOSITORY_TRUFFLEHOG
  - REPOSITORY_CHECKOV
  - JAVASCRIPT_STANDARD
  # spotless:check already enforces Java style; default checkstyle (sun_checks) and PMD conflict with it
  - JAVA_CHECKSTYLE
  - JAVA_PMD

DISABLE_ERRORS_LINTERS:
  - JAVASCRIPT_PRETTIER
  - CSS_STYLELINT
  - JSON_PRETTIER
  - YAML_PRETTIER
  - MARKDOWN_MARKDOWNLINT
  - MARKDOWN_MARKDOWN_TABLE_FORMATTER
  - REPOSITORY_TRIVY
  - DOCKERFILE_HADOLINT
  - YAML_V8R

LINTER_RULES_PATH: https://raw.githubusercontent.com/HSLdevcom/transitdata-shared-workflows/main/megalinter/linters
